<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#0F1E3D">
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
<style>
/* Same palette as index.html (app's src/theme.ts) */
:root { --bg:#EEF4FB; --card:#FFFFFF; --text:#13233A; --muted:#5B6B82; --border:#D4DEEB; --accent:#2D6CDF; --frost-row:#E6F0FF; --night:#0F1E3D; --night-2:#1A2D55; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#0E1622; --card:#172234; --text:#E5EDF8; --muted:#94A3B8; --border:#2A3A52; --accent:#5B93F0; --frost-row:#1B2C47; --night:#0B1630; --night-2:#15264A; }
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow-wrap: anywhere; }
a { color: var(--accent); }
a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 780px; margin: 0 auto; padding: 0 16px; }
.bar { background: linear-gradient(180deg, var(--night), var(--night-2)); color: #EAF3FF; padding: 16px 0 56px; }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-weight: 700; font-size: 17px; }
.brand img { width: 34px; height: 34px; border-radius: 9px; }
.bar nav a { color: #9DB4D6; text-decoration: none; font-weight: 600; font-size: 15px; }
.bar nav a:hover { color: #fff; }
main .doc { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px 20px; margin-top: -36px; box-shadow: 0 10px 30px rgba(19,35,58,.10); }
@media (min-width: 700px) { main .doc { padding: 36px 40px; } }
.doc h1 { font-size: clamp(26px, 6vw, 34px); line-height: 1.15; margin: 0 0 12px; }
.doc h2 { font-size: 20px; margin: 32px 0 8px; padding-top: 20px; border-top: 1px solid var(--border); }
.doc h3 { font-size: 17px; margin: 22px 0 6px; }
.doc p, .doc li { color: var(--text); }
.doc ul, .doc ol { padding-left: 22px; }
.doc li { margin-bottom: 6px; }
.doc code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; background: var(--frost-row); padding: 1px 6px; border-radius: 6px; }
.doc table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
.doc th, .doc td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
footer { margin-top: 40px; padding: 24px 0 36px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
footer nav { display: flex; flex-wrap: wrap; gap: 10px 22px; }
footer a { color: var(--text); text-decoration: none; font-weight: 600; }
footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/icon.png' | relative_url }}" alt="" width="34" height="34">{{ site.title }}</a>
    <nav><a href="{{ '/' | relative_url }}#get-it">Install</a></nav>
  </div>
</header>
<main class="wrap">
  <article class="doc">
{{ content }}
  </article>
</main>
<footer>
  <div class="wrap">
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/privacy' | relative_url }}">Privacy policy</a>
      <a href="mailto:frostywindowsapp@gmail.com">frostywindowsapp@gmail.com</a>
      <a href="https://ko-fi.com/frostywindows" rel="noopener">Support on Ko-fi</a>
    </nav>
  </div>
</footer>
</body>
</html>
